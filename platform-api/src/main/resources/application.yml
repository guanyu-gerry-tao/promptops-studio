server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/promptops
    username: promptops
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:promptops-run-worker}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.promptops.platformapi.dto
        spring.json.value.default.type: com.promptops.platformapi.dto.RunRequestedEvent

# JWT configuration
# ${JWT_SECRET:default} syntax means: read env var JWT_SECRET, if not set use the default value.
# In production, set the JWT_SECRET environment variable to a real random key.
jwt:
  secret: ${JWT_SECRET:PRODUCTION_MODE_DEFAULT_JWT_SECRET}
  expiration: 86400000  # 24 hours in milliseconds (24 * 60 * 60 * 1000)

# AI Runtime service (FastAPI)
# Spring Boot calls these endpoints to index documents and search the knowledge base.
ai-runtime:
  base-url: ${AI_RUNTIME_URL:http://localhost:8000}

kafka:
  topic:
    run-requested: run.requested

promptops:
  worker:
    enabled: ${PROMPTOPS_WORKER_ENABLED:false}
  runs:
    sync-fallback-enabled: ${PROMPTOPS_RUN_SYNC_FALLBACK:false}
