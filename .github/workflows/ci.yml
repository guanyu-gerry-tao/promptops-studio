name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  platform-api:
    name: Platform API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew test

  ai-runtime:
    name: AI Runtime tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx install poetry
      - run: poetry install --with dev
      - run: poetry run pytest -q

  images-and-k8s:
    name: Docker images and k8s manifests
    runs-on: ubuntu-latest
    needs: [frontend, platform-api, ai-runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        run: docker build -t promptops-frontend:ci ./frontend
      - name: Build platform-api image
        run: docker build -t promptops-platform-api:ci ./platform-api
      - name: Build ai-runtime image
        run: docker build -t promptops-ai-runtime:ci ./ai-runtime
      - name: Validate Kubernetes YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir["deploy/k8s/*.yaml"].sort.each { |f| YAML.load_stream(File.read(f)); puts "validated #{f}" }'
