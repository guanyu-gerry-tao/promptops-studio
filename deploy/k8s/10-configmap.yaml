apiVersion: v1
kind: ConfigMap
metadata:
  name: promptops-config
  namespace: promptops
data:
  PLATFORM_API_URL: "http://platform-api:8081"
  AI_RUNTIME_URL: "http://ai-runtime:8000"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_CONSUMER_GROUP_ID: "promptops-run-worker"
  WEAVIATE_HOST: "weaviate"
  WEAVIATE_PORT: "8080"
  RERANK_ENABLED: "false"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/promptops"
