apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-worker
  namespace: promptops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-worker
  template:
    metadata:
      labels:
        app: platform-worker
    spec:
      containers:
        - name: platform-worker
          image: promptops-platform-api:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--spring.main.web-application-type=none"
          env:
            - name: PROMPTOPS_WORKER_ENABLED
              value: "true"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: promptops-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: promptops-secret
                  key: MYSQL_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: promptops-secret
                  key: MYSQL_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: promptops-secret
                  key: JWT_SECRET
            - name: AI_RUNTIME_URL
              valueFrom:
                configMapKeyRef:
                  name: promptops-config
                  key: AI_RUNTIME_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: promptops-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_CONSUMER_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: promptops-config
                  key: KAFKA_CONSUMER_GROUP_ID
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
