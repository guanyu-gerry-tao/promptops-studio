apiVersion: v1
kind: Service
metadata:
  name: ai-runtime
  namespace: promptops
spec:
  selector:
    app: ai-runtime
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-runtime
  namespace: promptops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-runtime
  template:
    metadata:
      labels:
        app: ai-runtime
    spec:
      containers:
        - name: ai-runtime
          image: promptops-ai-runtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: promptops-secret
                  key: OPENAI_API_KEY
            - name: WEAVIATE_HOST
              valueFrom:
                configMapKeyRef:
                  name: promptops-config
                  key: WEAVIATE_HOST
            - name: WEAVIATE_PORT
              valueFrom:
                configMapKeyRef:
                  name: promptops-config
                  key: WEAVIATE_PORT
            - name: RERANK_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: promptops-config
                  key: RERANK_ENABLED
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
